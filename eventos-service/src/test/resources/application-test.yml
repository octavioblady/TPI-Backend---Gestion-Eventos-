spring:
  datasource:
    url: jdbc:h2:mem:eventos;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri:
          jwk-set-uri: http://localhost:0/certs
recursos:
  auth:
    enabled: false
app:
  docs:
    public: true
